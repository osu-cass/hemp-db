{% load static %}
<link rel="stylesheet" href="{% static 'helloworld/site.css' %}">
<h1>Changes Comparison</h1>
<table class="changes-comparison">
    <thead>
        <tr>
            <th>Field</th>
            <th>Company</th>
            <th>Pending Company</th>
        </tr>
    </thead>
    <tbody>
        {% for field, company_value, pending_value, is_different in context.fields %}
        <tr class="{% if is_different %}highlight{% endif %}">
            <td>{{ field }}</td>
            <td>{{ company_value }}</td>
            <td>{{ pending_value }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
