{# Company form fields in labeled sections. Pass a PendingCompanyForm as form. #}
{% for title, fields in form.sections %}
  <fieldset class="mb-4">
    <legend class="h5 border-bottom pb-1">{{ title }}</legend>
    {% for field in fields %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label d-block mb-1">{% if field.field.required %}<span class="text-danger" aria-hidden="true">*</span> {% endif %}{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
          <div class="text-danger small">{{ field.label }}: {{ error }}</div>
        {% endfor %}
      </div>
    {% endfor %}
  </fieldset>
{% endfor %}
