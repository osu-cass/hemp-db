name: Django CI

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Match container user to runner
      run: |
        echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
        echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
    - name: Build development image
      run: docker compose build app
    - name: Lint
      run: docker compose run --rm --no-deps --entrypoint ruff app check --no-cache .
    - name: Migrate and test
      run: docker compose run --rm app python manage.py test
    - name: Clean up
      if: always()
      run: docker compose down -v
