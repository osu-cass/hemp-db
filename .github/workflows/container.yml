name: Production Container

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Weekly rebuild so published images pick up base-image updates.
    - cron: '15 18 * * 3'

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create fake secrets
        run: |
          mkdir -p docker/secrets
          touch docker/secrets/secret_key
          touch docker/secrets/database_url

      - name: Validate production Compose
        run: |
          cp .env.production.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.deploy.yaml -f compose.prod.yaml config --quiet
          docker compose -f compose.deploy.yaml -f compose.prod.yaml --profile operations config --quiet
          docker compose -f compose.deploy.yaml -f compose.prod.yaml -f compose.build.yaml config --quiet

      - name: Validate staging Compose
        env:
          MAILPIT_UI_AUTH: ci:placeholder
        run: |
          cp .env.staging.example .env
          if output=$(env -u MAILPIT_UI_AUTH docker compose \
            -f compose.deploy.yaml -f compose.staging.yaml config --quiet 2>&1); then
            echo "Staging Compose accepted an empty MAILPIT_UI_AUTH"
            exit 1
          fi
          if [[ "$output" != *"MAILPIT_UI_AUTH"* ]]; then
            printf '%s\n' "$output"
            exit 1
          fi
          docker compose -f compose.deploy.yaml -f compose.staging.yaml config --quiet
          docker compose -f compose.deploy.yaml -f compose.staging.yaml --profile operations config --quiet

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main", "dev"]') || fromJSON('[""]') }}

    steps:
      - name: Determine branch to build
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=${{ matrix.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && matrix.branch || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same-repo pull requests publish a pr-<number> tag so staging can
      # test a PR image before merge; fork PRs have a read-only token.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=dev,enable=${{ steps.branch.outputs.ref == 'dev' }}
            type=raw,value=main,enable=${{ steps.branch.outputs.ref == 'main' }}
            type=raw,value=latest,enable=${{ steps.branch.outputs.ref == 'main' }}

      - name: Build and publish production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Scheduled runs re-pull the base image and skip the cache so the
          # weekly rebuild actually picks up base-image updates.
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=production-${{ steps.branch.outputs.ref }}
          cache-to: type=gha,scope=production-${{ steps.branch.outputs.ref }},mode=max
          provenance: mode=max
          sbom: true
